name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ $code -eq 5 ]; then
            echo "No tests collected yet - Core Platform implementation is in progress."
            exit 0
          fi
          exit $code
