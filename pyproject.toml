[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aria-document-inspection-agent"
version = "1.0.0"
description = "ARIA — AI Regulatory Inspection Accelerator: AI Evidence-to-Decision Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Microsoft Corporation" }]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]